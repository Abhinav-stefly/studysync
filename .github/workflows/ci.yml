name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push cancels the older run still in progress on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongoms-cache
      # Dummy values only. Replace these NAMES with the ones your code
      # actually reads (from the findstr output above).
    
      JWT_ACCESS_SECRET: ci-only-access-secret
      JWT_REFRESH_SECRET: ci-only-refresh-secret
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # mongodb-memory-server downloads a MongoDB binary on first use.
      # Caching it avoids repeating that download (and the hang we saw locally).
      - uses: actions/cache@v4
        with:
          path: .mongoms-cache
          key: mongoms-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

      - run: npm ci
      - run: npm run build
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t studysync-backend ./backend